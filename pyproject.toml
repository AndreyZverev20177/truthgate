[project]
name = "truthgate"
version = "0.1.0"
description = "Autonomous offensive-security AI with a deterministic proof gate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Truthgate" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
    "detect-secrets>=1.5",
]
llm = ["anthropic>=0.34", "openai>=1.40"]

[project.scripts]
truthgate = "orchestrator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator", "tools", "phase1"]

# ── uv / PEP 735 dependency groups ────────────────────────────────────────────
[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["benchmarks/**/app"]

[tool.ruff.lint]
select = ["E","F","W","I","B","UP","SIM","S","RUF","PL"]
ignore = ["S101","PLR0913","PLR2004","S603","S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S","PLR"]
"benchmarks/**/*" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
disallow_any_generics = true
namespace_packages = true
explicit_package_bases = true
exclude = ["benchmarks/.*/app/.*"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "tools/core/tests", "tools/validators/tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "slow: тест долгий (>2s)",
    "live: требует внешней цели / сети",
    "oob: требует OAST-инстанс",
    "unit: unit-тест ядра (быстрый, без сети)",
    "integration: интеграционный тест (несколько модулей, локальные ресурсы)",
    "anti_fp: PASS на уязвимой цели, FAIL на безопасной — сердце валидатора",
]

[tool.coverage.run]
source = ["orchestrator", "tools", "phase1"]
omit = ["*/tests/*", "benchmarks/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
